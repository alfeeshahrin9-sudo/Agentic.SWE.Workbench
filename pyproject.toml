[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-swe"
version = "0.1.0"
description = "Local Agentic Software Engineering Workbench — multi-agent self-healing factory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alfee" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "mcp>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = [
  "langchain-openai>=0.2",
  "dspy-ai>=2.5",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
agentic-swe = "agentic_swe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_swe"]

# Map src layout → import name agentic_swe
[tool.hatch.build.targets.wheel.sources]
"src/agentic_swe" = "agentic_swe"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
