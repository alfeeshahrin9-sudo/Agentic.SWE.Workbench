name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js (for TS/JS fixture tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run pytest suite
        run: pytest -v

  eval-harness:
    name: Gold-Patch Evaluation Harness
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run gold-patch evaluation suite (strict command policy)
        run: |
          agentic-swe eval \
            --tasks evals/tasks.json \
            --policy strict \
            --min-pass-rate 1.0 \
            --output eval-report.json

      - name: Upload evaluation report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          retention-days: 14

  docker-sandbox-smoke:
    name: Docker Sandbox Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build hardened sandbox image
        run: docker build -t agentic-swe-sandbox:ci .

      - name: Verify DockerSandbox isolation & evaluation
        env:
          AGENTIC_SWE_SANDBOX_BACKEND: docker
          AGENTIC_SWE_DOCKER_IMAGE: agentic-swe-sandbox:ci
          AGENTIC_SWE_COMMAND_POLICY_MODE: strict
        run: |
          agentic-swe eval \
            --tasks evals/tasks.json \
            --backend docker \
            --policy strict \
            --min-pass-rate 1.0 \
            --output docker-eval-report.json

      - name: Upload Docker eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-eval-report
          path: docker-eval-report.json
          retention-days: 14

  terraform-validate:
    name: Validate Optional AWS Terraform Runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
